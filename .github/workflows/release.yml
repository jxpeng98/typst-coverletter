name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1

      - name: Validate version and examples
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/p' typst.toml)
          test "$package_version" = "$GITHUB_REF_NAME"
          typst compile example-coverletter.typ /tmp/coverletter.pdf
          typst compile example-statement.typ /tmp/statement.pdf

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/modernpro-coverletter/template

          cp \
            modernpro-coverletter.typ \
            typst.toml \
            README.md \
            CHANGELOG.md \
            LICENSE \
            thumbnail.png \
            example-coverletter.typ \
            example-statement.typ \
            dist/modernpro-coverletter/
          cp -R template/. dist/modernpro-coverletter/template/

          (
            cd dist
            zip -r "modernpro-coverletter-${GITHUB_REF_NAME}.zip" modernpro-coverletter
          )

      - name: Extract release notes
        shell: bash
        run: |
          set -euo pipefail
          awk -v version="$GITHUB_REF_NAME" '
            index($0, "## [" version "]") == 1 { capture = 1 }
            capture && printed && index($0, "## [") == 1 { exit }
            capture { print; printed = 1 }
            END { if (!capture) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/modernpro-coverletter-${GITHUB_REF_NAME}.zip" \
            modernpro-coverletter.typ \
            template/coverletter.typ \
            template/statement.typ \
            --verify-tag \
            --title "modernpro-coverletter ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
